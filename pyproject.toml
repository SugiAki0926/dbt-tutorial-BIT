[project]
name = "dbt-tutorial-bit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-core==1.9.4",
    "dbt-snowflake==1.9.4",
]

[dependency-groups]
dev = [
    "chardet>=5.2,<6",
    "ruff>=0.16.8",
    "sqlfluff>=4.3.0",
    "sqlfluff-templater-dbt>=4.3.0",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
